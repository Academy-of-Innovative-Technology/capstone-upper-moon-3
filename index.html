
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Spot Finder</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>

    <div class="bar">
        <div class="menu">
            <h2>🌍 Quiet Spot Finder</h2>
            <div class="menu-links">
                <a href="#">Home</a>
                <a href="#">About</a>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <div class="sidebar">
            <h1>Find Your Peace</h1>
            <p>Discover quiet parks, libraries, and cafes near your current location. We rank them by peacefulness and proximity.</p>
            
            <button id="quietBtn">🔍 Find Quiet Spots</button>
            
            <div id="statusBox" class="status"></div>
            
            <div id="spotList" class="spot-list"></div>
        </div>

        <div class="map-wrap" id="map-wrapper-outer">
            <div id="map-wrapper-inner">
                <div id="btn-container">
                    <button id="narrow" class="btn-control">Narrow</button>
                    <button id="full" class="btn-control active">Full</button>
                    <button id="wide" class="btn-control">Wide</button>
                </div>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="src/js/script.js"></script>
</body>
</html>
